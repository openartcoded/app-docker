services:
  ####### MongoDB #######
  mongo:
    image: mongo:8
    networks:
      artcoded:
    restart: always
    volumes:
      - ./data/db:/data/db
  ####### Keycloak #######
  postgresql:
    restart: always
    networks:
      artcoded:
    image: "postgres:18"
    volumes:
      - ./data/keycloak-postgres-18:/var/lib/postgresql
  keycloak:
    restart: always
    image: nbittich/keycloak:26.8.2
    networks:
      artcoded:
    command: start --optimized --proxy-headers xforwarded
  ####### Redis #######
  redis:
    image: valkey/valkey:9-alpine
    restart: always
    networks:
      artcoded:
    command: redis-server  --appendonly yes
    volumes:
      - ./data/redis:/data
  ####### File Search #######
  file-search:
    image: nbittich/file-search:2027.0.0
    restart: always
    networks:
      artcoded:
    environment:
      UPLOAD_DIR: /uploads
      INGEST_STATE_DIR: /app/state
      INDEX_DIR_PATH: /index
      UPLOAD_SCAN_INTERVAL_SECS: 10
    volumes:
      - ./data/backend/files:/uploads:ro
      - ./data/file-search/state:/app/state
      - ./data/file-search/index:/index
    expose:
      - "8080"
  ####### New file service #######
  file-service:
    image: nbittich/file-service:2027.0.0
    environment:
      TMP_FS_PATH: "/temporary"
    tmpfs:
      - /temporary:size=4096m
    volumes:
      - ./data/backend/files:/astorage
    networks:
      artcoded:
    restart: always
  ####### Artemis #######
  artemis:
    image: nbittich/artemis:2027.0.0
    networks:
      artcoded:
    restart: always
    volumes:
      - ./config/artemis/login.config:/var/lib/artemis-instance/etc/login.config
      - ./config/artemis/broker.xml:/var/lib/artemis-instance/etc/broker.xml
      - ./data/artemis:/var/lib/artemis-instance/data
      - ./data/artemis/journal:/var/lib/artemis-instance/data/journal
    environment:
      ARTEMIS_JVM_ARGS: "-XX:+UseCompactObjectHeaders"
    user: root
  ####### Api Gateway #######
  api-gateway:
    image: nbittich/api-gateway:2027.0.0
    restart: always
    networks:
      artcoded:
    depends_on:
      - api-backend
      - back-office
      - website
      - triplestore
    volumes:
      - ./config/gateway:/usr/config
  ####### Api Backend #######
  api-backend:
    image: nbittich/api-backend:2027.5.0
    restart: always
    networks:
      artcoded:
    tmpfs:
      - /temporary:size=4096m
    volumes:
      - ./data/backend:/var/artcoded/data
      - ./data/backend/temp:/var/undertow/upload
      - ./config/backend:/usr/config
      - ./config/scripts:/var/artcoded_scripts
    depends_on:
      - sftp
  ####### BACK OFFICE V2 #######
  back-officev2:
    image: nbittich/openartcoded-backoffice:v2027.5.0
    restart: always
    networks:
      artcoded:
    volumes:
      - ./config/back-office/nginx.conf:/etc/nginx/nginx.conf

  ####### BACK OFFICE #######
  back-office:
    image: nbittich/back-office:v2026.6.3
    restart: always
    networks:
      artcoded:
    volumes:
      - ./config/back-office/nginx.conf:/etc/nginx/nginx.conf
  ####### Triplestore #######
  triplestore:
    networks:
      artcoded:
    image: nbittich/triplestore:2027.0.0
    restart: always
    volumes:
      - ./data/tdb2:/triplestore
      - ./data/migrations:/migrations
  ####### Website #######
  website:
    image: nbittich/websitev2:2027.0.1
    restart: always
    networks:
      artcoded:
  ####### Graphana #######
  grafana:
    restart: unless-stopped
    image: grafana/grafana:13.3.1
    networks:
      artcoded:
    volumes:
      - ./data/grafana:/var/lib/grafana

  ####### Node Exporter #######
  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring_node_exporter
    restart: unless-stopped
    networks:
      artcoded:
    expose:
      - 9100
  ####### SFTP       #######
  sftp:
    cap_add:
      - NET_ADMIN
    environment:
      FAIL2BAN: "true"   # optional
    networks:
      artcoded:
    image: nbittich/sftp:2027.0.0
    volumes:
      - ./data/peppol/ftp/invoices:/home/peppol/invoices
      - ./data/peppol/ftp/expenses/:/home/peppol/expenses
    command: peppol::1001
  ####### Prometheus #######
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.13.5
    volumes:
      - ./data/prometheus:/prometheus
    depends_on:
      - keycloak
    networks:
      artcoded:
  ###### Yopass ######
  yopass:
    image: jhaals/yopass
    restart: always
    command: "--database=redis --redis=redis://redis:6379 --port 80"
    depends_on:
      - redis
    networks:
      artcoded:
  ###### Nextcloud ######
  cloud:
    restart: always
    image: nextcloud:35-fpm-alpine
    volumes:
      - ./data/nextcloud:/var/www/html
    depends_on:
      - postgresql
      - redis
    networks:
      artcoded:
  cloud-cron:
    image: nextcloud:35-fpm-alpine
    restart: always
    volumes:
      - ./../nextcloud-data:/var/www/html
    entrypoint: /cron.sh
    networks:
      artcoded:
    depends_on:
      - postgresql
      - redis
      - cloud

networks:
  artcoded:
